[platformio]
default_envs = listen_1m

[env]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 921600
upload_speed = 460800
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0

[env:listen_1m]
build_src_filter = +<main.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000

[env:listen_500k]
build_src_filter = +<main.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=500000

; Loopback self-test for the active stage. This build transmits frames, but its
; only purpose is to have the controller receive its own frames with TX and RX tied
; together on the transceiver and nothing attached to a real bus. It must never be
; used in place of the listener firmware.
[env:loopback_test]
build_src_filter = +<loopback_test.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000 -DLOOPBACK_SELF_TEST=1

; M5 replay firmware: sends bring-up traffic to the focus motor in stages. Boots in
; LISTEN ONLY and only transmits after a 2 second BOOT press, for a bounded window.
; The bus must hold ONLY the motor (its own adapter for 5V); never the RS3.
[env:replay_s1]
build_src_filter = +<transmit_replay.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000 -DREPLAY_STAGE=1 -DREPLAY_SECONDS=15

; Same as replay_s1 but starts transmitting the moment it boots, repeating as fast
; as the driver accepts. The point is to have frames already going out BEFORE the
; motor powers up: once its flood starts there is no room left on the bus for a
; 13 byte frame, so the only usable window is the ~100 ms of quiet after power-up.
; Flash this, then switch the motor on.
[env:replay_s1_auto]
build_src_filter = +<transmit_replay.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000 -DREPLAY_STAGE=1 -DREPLAY_SECONDS=120 -DREPLAY_INTERVAL_MS=5 -DREPLAY_AUTO_START=1

; Stage 4: bring-up request plus the periodic dial command with value zero. Used to
; test whether the dial stream is what makes the motor report a healthy link, which
; the LED shows as solid green instead of solid red.
;
; NORMAL mode waits for an acknowledgement on every frame. The only other node is the
; motor, which does not acknowledge us, so sends block and the transmit queue backs
; up - which is where the twai_transmit panic comes from. See replay_s4_noack.
; Full RS3 startup handshake, then the steady dial stream. From the startup capture the
; motor answers traffic but does not report a healthy link until it has been walked
; through: gimbal attitude stream (04:05) -> startup dial request -> GB53 reply ->
; request, after which the steady dial stream runs on both 0x503 and 0x201.
[env:replay_s4_auto]
build_src_filter = +<transmit_replay.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000 -DREPLAY_STAGE=4 -DREPLAY_SECONDS=120 -DREPLAY_INTERVAL_MS=5 -DREPLAY_AUTO_START=1 -DREPLAY_INCLUDE_0469=1 -DREPLAY_0469_INTERVAL_MS=10 -DREPLAY_HANDSHAKE=1 -DREPLAY_HANDSHAKE_UNTIL_MS=3000 -DTX_QUEUE_LEN=0 -DREPLAY_ANALYTIC_ATTITUDE=1

; Same as replay_s4_auto but the controller runs in NO_ACK mode, so a transmitted
; frame is not held waiting for an acknowledgement the motor never sends. That is the
; suspected route out of the twai_transmit panic that every NORMAL-mode S4 variant hit.
[env:replay_s4_noack]
build_src_filter = +<transmit_replay.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000 -DREPLAY_STAGE=4 -DREPLAY_SECONDS=120 -DREPLAY_INTERVAL_MS=500 -DREPLAY_AUTO_START=1 -DREPLAY_INCLUDE_0469=1 -DREPLAY_0469_INTERVAL_MS=50 -DTX_QUEUE_LEN=0

; Transmit diagnostic: sends a few SINGLE SHOT frames and reports the TWAI error
; counters before and after. That distinguishes "nobody acknowledges us" from a
; physical-layer or bit-timing problem without needing a scope, and single-shot
; transmission cannot wedge the transmit buffer the way endless retries did.
; Boots in LISTEN ONLY and only transmits after a 2 second BOOT press.
[env:diagnose_tx]
build_src_filter = +<diagnose_tx.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000 -DDIAG_TX_QUEUE_LEN=0

; Re-sends the whole boot sequence once a second instead of once per window.
; This reproduces the behaviour that coincided with the status LED going green: when
; the firmware was crash-looping it kept re-announcing, and the green came and went
; with varying duration; with a single announcement per run the LED stayed red.
; Manual trigger (hold BOOT 2 s) so the operator can start recording first.
[env:replay_periodic]
build_src_filter = +<transmit_replay.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000 -DREPLAY_STAGE=4 -DREPLAY_SECONDS=180 -DREPLAY_INTERVAL_MS=5 -DREPLAY_AUTO_START=0 -DREPLAY_INCLUDE_0469=1 -DREPLAY_0469_INTERVAL_MS=10 -DREPLAY_HANDSHAKE=1 -DREPLAY_HANDSHAKE_UNTIL_MS=3000 -DREPLAY_SEQUENCE_PERIOD_MS=1000 -DTX_QUEUE_LEN=0

; Deliberately reproduces the crash loop that coincided with the LED going green.
; With tx_queue_len > 0 the TWAI driver corrupts its transmit queue and panics
; (see AGENTS.md), so the board reboots every fraction of a second. That is exactly
; the condition under which the operator saw green flashes of varying duration.
; This exists only to reproduce that condition for observation - it is not a fix.
[env:replay_crashloop]
build_src_filter = +<transmit_replay.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000 -DREPLAY_STAGE=4 -DREPLAY_SECONDS=180 -DREPLAY_INTERVAL_MS=5 -DREPLAY_AUTO_START=1 -DREPLAY_INCLUDE_0469=1 -DREPLAY_0469_INTERVAL_MS=10 -DREPLAY_HANDSHAKE=1 -DREPLAY_HANDSHAKE_UNTIL_MS=3000 -DTX_QUEUE_LEN=8

; EXACT historical firmware from commit 7e261d4 (2026-10-08 01:49 local), the version
; that was running while the operator saw the status LED go green. Rebuilt here as a
; separate source file so the current work tree is untouched. It sends only the 00:01
; request plus the steady 04:69, and uses tx_queue_len = 8, so it crash-loops - which
; is precisely the condition under which the green was observed.
[env:replay_hist]
build_src_filter = +<transmit_replay_hist.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000 -DREPLAY_STAGE=4 -DREPLAY_SECONDS=120 -DREPLAY_INTERVAL_MS=500 -DREPLAY_AUTO_START=1 -DREPLAY_INCLUDE_0469=1
; BINARY SEARCH STEP 1: the current firmware with ONLY the crash loop restored
; (TX_QUEUE_LEN=8). Everything else is unchanged from replay_s4_auto. If the LED goes
; green with this, the crash loop alone is the condition; if not, keep bisecting.
[env:replay_bisect1]
build_src_filter = +<transmit_replay.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000 -DREPLAY_STAGE=4 -DREPLAY_SECONDS=180 -DREPLAY_INTERVAL_MS=5 -DREPLAY_AUTO_START=1 -DREPLAY_INCLUDE_0469=1 -DREPLAY_0469_INTERVAL_MS=10 -DREPLAY_HANDSHAKE=1 -DREPLAY_HANDSHAKE_UNTIL_MS=3000 -DTX_QUEUE_LEN=8
; BINARY SEARCH STEP 2: current firmware + crash loop + the historical dial framing,
; i.e. a single 0x503 packet whose sequence stays at zero and no 0x201 route. The
; historical version that made the LED green did exactly this, while the current one
; uses two routes and a sequence that starts at 6038 - which a motor could read as a
; stale sequence from a previous session.
[env:replay_bisect2]
build_src_filter = +<transmit_replay.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000 -DREPLAY_STAGE=4 -DREPLAY_SECONDS=180 -DREPLAY_INTERVAL_MS=5 -DREPLAY_AUTO_START=1 -DREPLAY_INCLUDE_0469=1 -DREPLAY_0469_INTERVAL_MS=10 -DREPLAY_HANDSHAKE=1 -DREPLAY_HANDSHAKE_UNTIL_MS=3000 -DTX_QUEUE_LEN=8 -DREPLAY_SINGLE_ROUTE=1 -DREPLAY_SEQ_START=0 -DREPLAY_SEQ_STEP=0
; BINARY SEARCH STEP 3: strip the extra boot packets so only the 00:01 request and the
; steady 04:69 go out - the exact message set the green-LED version sent. Keeps the
; crash loop, sequence 0 and the single 0x503 route that step 2 already tested.
[env:replay_bisect3]
build_src_filter = +<transmit_replay.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000 -DREPLAY_STAGE=4 -DREPLAY_SECONDS=180 -DREPLAY_INTERVAL_MS=5 -DREPLAY_AUTO_START=1 -DREPLAY_INCLUDE_0469=1 -DREPLAY_0469_INTERVAL_MS=10 -DREPLAY_HANDSHAKE=1 -DREPLAY_HANDSHAKE_UNTIL_MS=3000 -DTX_QUEUE_LEN=8 -DREPLAY_SINGLE_ROUTE=1 -DREPLAY_SEQ_START=0 -DREPLAY_SEQ_STEP=0 -DREPLAY_SKIP_BOOT_MESSAGES=1
; BINARY SEARCH STEP 4: step 3 plus the legacy send path - no idle gate, 20 ms
; transmit timeout - so send_packet matches the green-LED version token for token.
; This is the last remaining difference between the two builds.
[env:replay_bisect4]
build_src_filter = +<transmit_replay.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000 -DREPLAY_STAGE=4 -DREPLAY_SECONDS=180 -DREPLAY_INTERVAL_MS=5 -DREPLAY_AUTO_START=1 -DREPLAY_INCLUDE_0469=1 -DREPLAY_0469_INTERVAL_MS=10 -DREPLAY_HANDSHAKE=1 -DREPLAY_HANDSHAKE_UNTIL_MS=3000 -DTX_QUEUE_LEN=8 -DREPLAY_SINGLE_ROUTE=1 -DREPLAY_SEQ_START=0 -DREPLAY_SEQ_STEP=0 -DREPLAY_SKIP_BOOT_MESSAGES=1 -DREPLAY_LEGACY_SEND=1
; BINARY SEARCH STEP 5: step 4 with the historical pacing restored.
; The exhaustive build comparison showed the only effective macros that differed were
; REPLAY_INTERVAL_MS (5 vs the historical 500, i.e. 100x faster) and REPLAY_SECONDS.
; Every other macro the historical source reads already matched, and the 14 newer
; macros are simply not read by that source at all.
[env:replay_bisect5]
build_src_filter = +<transmit_replay.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000 -DREPLAY_STAGE=4 -DREPLAY_SECONDS=120 -DREPLAY_INTERVAL_MS=500 -DREPLAY_AUTO_START=1 -DREPLAY_INCLUDE_0469=1 -DREPLAY_0469_INTERVAL_MS=10 -DREPLAY_HANDSHAKE=1 -DREPLAY_HANDSHAKE_UNTIL_MS=3000 -DTX_QUEUE_LEN=8 -DREPLAY_SINGLE_ROUTE=1 -DREPLAY_SEQ_START=0 -DREPLAY_SEQ_STEP=0 -DREPLAY_SKIP_BOOT_MESSAGES=1 -DREPLAY_LEGACY_SEND=1
; Echo build: same settings as the historical version but with self reception on, so
; the capture log contains the frames WE transmit. That makes it possible to compare
; the actual bytes on the wire between the two builds instead of reading source.
[env:replay_echo]
build_src_filter = +<transmit_replay.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000 -DREPLAY_STAGE=4 -DREPLAY_SECONDS=120 -DREPLAY_INTERVAL_MS=500 -DREPLAY_AUTO_START=1 -DREPLAY_INCLUDE_0469=1 -DREPLAY_0469_INTERVAL_MS=10 -DREPLAY_HANDSHAKE=1 -DREPLAY_HANDSHAKE_UNTIL_MS=3000 -DTX_QUEUE_LEN=0 -DREPLAY_SINGLE_ROUTE=1 -DREPLAY_SEQ_START=0 -DREPLAY_SEQ_STEP=0 -DREPLAY_SKIP_BOOT_MESSAGES=1 -DREPLAY_LEGACY_SEND=1 -DREPLAY_ECHO_FRAMES=1
; The historical build with self reception on, for a same-method byte comparison
; against replay_echo.
[env:replay_hist_echo]
build_src_filter = +<transmit_replay_hist.cpp>
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000 -DREPLAY_STAGE=4 -DREPLAY_SECONDS=120 -DREPLAY_INTERVAL_MS=500 -DREPLAY_AUTO_START=1 -DREPLAY_INCLUDE_0469=1 -DREPLAY_ECHO_FRAMES=1

; Offline-prepared startup timing comparison. Both retain bisect5's queue=8
; diagnostic configuration and may panic; these are NOT stable replay firmware.
; They differ only in the steady dial delay. Both echo actual frames, keep seq=0
; and the single route, and print configuration before driver/task startup.
; Do not upload while capturing or replace the preserved green-flash control
; without arranging the isolated motor-only comparison.
[env:replay_gate100_echo]
extends = env:replay_bisect5
build_flags = ${env:replay_bisect5.build_flags} -DREPLAY_ECHO_FRAMES=1 -DREPLAY_LOG_CONFIG=1 -DREPLAY_STEADY_DELAY_MS=100

[env:replay_gate0_echo]
extends = env:replay_bisect5
build_flags = ${env:replay_bisect5.build_flags} -DREPLAY_ECHO_FRAMES=1 -DREPLAY_LOG_CONFIG=1 -DREPLAY_STEADY_DELAY_MS=0

; Stable candidate: preserve the confirmed gate0 first burst, disable the TX
; queue, wait before every fragment, and exclude RX calls during driver rebuilds.
; Removes inherited definitions before adding replacements (no macro redefinition).
[env:replay_gate0_stable_echo]
extends = env:replay_bisect5
build_unflags = -DTX_QUEUE_LEN=8 -DREPLAY_LEGACY_SEND=1
build_flags = ${env:replay_gate0_echo.build_flags} -DTX_QUEUE_LEN=0 -DREPLAY_LEGACY_SEND=0 -DREPLAY_SYNC_RX=1

; Cadence comparison: same stable zero-value packets and 120s limit; only the
; scheduler interval changes from 500ms to 50ms. Keep the baseline environment.
[env:replay_gate0_stable_50ms_echo]
extends = env:replay_bisect5
build_unflags = -DTX_QUEUE_LEN=8 -DREPLAY_LEGACY_SEND=1 -DREPLAY_INTERVAL_MS=500
build_flags = ${env:replay_gate0_stable_echo.build_flags} -DREPLAY_INTERVAL_MS=50

; Prepared only: manual BOOT start, 5s zero warmup, +16 for 200ms, then zero.
; Requires a separate explicit motion-stage authorization before upload/use.
[env:replay_gate0_probe16_echo]
extends = env:replay_bisect5
build_unflags = -DTX_QUEUE_LEN=8 -DREPLAY_LEGACY_SEND=1 -DREPLAY_INTERVAL_MS=500 -DREPLAY_AUTO_START=1 -DREPLAY_SECONDS=120
build_flags = ${env:replay_gate0_stable_50ms_echo.build_flags} -DREPLAY_AUTO_START=0 -DREPLAY_SECONDS=15 -DREPLAY_DIAL_PROBE_VALUE=16 -DREPLAY_DIAL_PROBE_START_MS=5000 -DREPLAY_DIAL_PROBE_DURATION_MS=200

; Prepared reverse-sign comparison; same bounds, separate stage authorization.
[env:replay_gate0_probe_minus16_echo]
extends = env:replay_bisect5
build_unflags = -DTX_QUEUE_LEN=8 -DREPLAY_LEGACY_SEND=1 -DREPLAY_INTERVAL_MS=500 -DREPLAY_AUTO_START=1 -DREPLAY_SECONDS=120 -DREPLAY_DIAL_PROBE_VALUE=16
build_flags = ${env:replay_gate0_probe16_echo.build_flags} -DREPLAY_DIAL_PROBE_VALUE=-16

; Prepared controllability candidate: same verified -16 sign, same 50 ms cadence,
; same TX0/per-fragment-wait/single-route seq0/RX-sync path, but the commanded value
; is HELD for 3 s instead of a 200 ms pulse, and the window is 20 s. Holding is the
; single variable added here; it exists so the commanded motion can be observed
; (start, direction, return to zero) instead of only inferred. The value is held at
; the same +/-16 magnitude as the completed direction comparison - raising the
; magnitude is a separate authorization. The 5 s zero-value warmup is the source
; default, so the probe starts at t=5000 ms and returns to zero at t=8000 ms.
; Prepared only; requires a separate explicit motion-stage authorization before upload.
[env:replay_gate0_hold16_echo]
extends = env:replay_bisect5
build_unflags = -DTX_QUEUE_LEN=8 -DREPLAY_LEGACY_SEND=1 -DREPLAY_INTERVAL_MS=500 -DREPLAY_AUTO_START=1 -DREPLAY_SECONDS=120 -DREPLAY_SECONDS=15 -DREPLAY_DIAL_PROBE_VALUE=16 -DREPLAY_DIAL_PROBE_DURATION_MS=200
build_flags = ${env:replay_gate0_probe16_echo.build_flags} -DREPLAY_SECONDS=20 -DREPLAY_DIAL_PROBE_VALUE=-16 -DREPLAY_DIAL_PROBE_HOLD=1 -DREPLAY_DIAL_PROBE_DURATION_MS=3000

; Symmetry counterpart of the candidate above: identical in every respect (hold
; duration, window, cadence, queue, route, sequence, RX sync) except the sign of the
; commanded value. Running the two back to back is the single-variable check that a
; negative value and a positive value drive the motor in opposite directions.
; The value is deliberately NOT un-flagged or re-defined here: this environment
; inherits +16 from the pulse build, which is already the intended sign. Un-flagging
; it removes it from the inlined ${...build_flags} as well, which silently produces a
; probe-disabled image (the regression test rejects that).
; Prepared only; requires a separate explicit motion-stage authorization before upload.
[env:replay_gate0_holdup16_echo]
extends = env:replay_bisect5
build_unflags = -DTX_QUEUE_LEN=8 -DREPLAY_LEGACY_SEND=1 -DREPLAY_INTERVAL_MS=500 -DREPLAY_AUTO_START=1 -DREPLAY_SECONDS=120 -DREPLAY_SECONDS=15 -DREPLAY_DIAL_PROBE_DURATION_MS=200
build_flags = ${env:replay_gate0_probe16_echo.build_flags} -DREPLAY_SECONDS=20 -DREPLAY_DIAL_PROBE_HOLD=1 -DREPLAY_DIAL_PROBE_DURATION_MS=3000
