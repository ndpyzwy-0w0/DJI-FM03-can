[platformio]
default_envs = listen_1m

[env]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 921600
upload_speed = 460800
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0

[env:listen_1m]
build_flags = ${env.build_flags} -DCAN_BITRATE=1000000

[env:listen_500k]
build_flags = ${env.build_flags} -DCAN_BITRATE=500000
